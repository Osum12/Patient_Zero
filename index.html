<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Zero</title>
<meta name="description" content="A genetics mystery: trace a recessive disorder back through a four-generation pedigree.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root {
  --bg: #eef2f1;
  --surface: #fbfcfc;
  --surface-2: #e4eae9;
  --ink: #17211f;
  --muted: #5b6b68;
  --line: #c6d1cf;
  --teal: #0d7a72;
  --teal-ink: #ffffff;
  --teal-soft: #d4ebe8;
  --red: #c0392b;
  --red-soft: #f6dcd8;
  --amber: #c98a12;
  --amber-soft: #f7ebcf;
  --green: #2e8b57;
  --green-soft: #d8eedf;
  --paper: #efe3c6;
  --paper-ink: #3b2f1c;
  --paper-edge: #cdb98a;
  --shadow: 0 1px 2px rgba(20,40,38,.08), 0 6px 24px rgba(20,40,38,.08);
  --focus: 0 0 0 3px var(--bg), 0 0 0 5px var(--teal);
  --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1615; --surface: #172120; --surface-2: #1f2c2a; --ink: #e3ecea; --muted: #93a6a2;
    --line: #2f403d; --teal: #3fb8ad; --teal-ink: #06211e; --teal-soft: #173b38;
    --red: #e8665a; --red-soft: #3d1f1c; --amber: #e2ab3d; --amber-soft: #3a2e14;
    --green: #5cc48a; --green-soft: #173323; --paper: #2b2519; --paper-ink: #eadcb8; --paper-edge: #5a4c2c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1615; --surface: #172120; --surface-2: #1f2c2a; --ink: #e3ecea; --muted: #93a6a2;
  --line: #2f403d; --teal: #3fb8ad; --teal-ink: #06211e; --teal-soft: #173b38;
  --red: #e8665a; --red-soft: #3d1f1c; --amber: #e2ab3d; --amber-soft: #3a2e14;
  --green: #5cc48a; --green-soft: #173323; --paper: #2b2519; --paper-ink: #eadcb8; --paper-edge: #5a4c2c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

/* ============================================================
   BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
  min-height: 100vh;
}
h1, h2, h3, h4 { line-height: 1.15; margin: 0 0 .5em; }
p { margin: 0 0 .9em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; gap: .5em; justify-content: center;
  border: 1.5px solid var(--teal); background: var(--teal); color: var(--teal-ink);
  padding: .6em 1.1em; border-radius: 8px; font-weight: 600; cursor: pointer;
  transition: transform .12s ease, filter .12s ease;
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--teal); }
.btn.small { padding: .35em .75em; font-size: .875rem; }
.btn.danger { border-color: var(--red); color: var(--red); background: transparent; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; }
.eyebrow { font-family: var(--mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: .4em; font-size: .8rem; font-weight: 600;
  padding: .25em .7em; border-radius: 999px; background: var(--teal-soft); color: var(--teal);
}
.chip.red { background: var(--red-soft); color: var(--red); }
.chip.amber { background: var(--amber-soft); color: var(--amber); }
.chip.green { background: var(--green-soft); color: var(--green); }

/* ============================================================
   TITLE / BRIEF / WIN
   ============================================================ */
.screen-center { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
.title-card { max-width: 640px; width: 100%; position: relative; padding: 48px 32px 36px; text-align: left; }
.title-card h1 { font-size: clamp(2.6rem, 9vw, 4.4rem); font-weight: 800; letter-spacing: -.02em; margin: .2em 0 .15em; }
.title-card .lede { font-size: 1.1rem; color: var(--muted); max-width: 46ch; }
.stamp {
  display: inline-block; font-family: var(--mono); font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--red); border: 2.5px solid var(--red); padding: .35em .8em; border-radius: 4px;
  transform: rotate(-4deg); font-size: .85rem; opacity: .9;
  animation: stamp-in .5s cubic-bezier(.2,1.6,.4,1) both .2s;
}
@keyframes stamp-in { from { transform: rotate(-4deg) scale(1.8); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: .9; } }
.linkish { border: 0; background: none; padding: 0; margin-top: 18px; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .85rem; }
.title-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.case-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 28px; border-top: 1px dashed var(--line); padding-top: 18px; }
.case-meta div { font-family: var(--mono); font-size: .8rem; }
.case-meta b { display: block; font-family: var(--ui); font-size: .95rem; }

.memo { max-width: 760px; width: 100%; }
.memo-head { font-family: var(--mono); font-size: .85rem; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; display: grid; gap: 2px; }
.memo-head span { color: var(--muted); display: inline-block; min-width: 4.5em; }
.memo h2 { font-size: 1.6rem; }
.memo ol { padding-left: 1.2em; }
.memo li { margin-bottom: .4em; }

.win-card { max-width: 820px; width: 100%; }
.win-card h1 { font-size: clamp(1.8rem, 6vw, 2.8rem); }
.debrief { display: grid; gap: 14px; margin: 20px 0; }
.debrief section { border-left: 3px solid var(--teal); padding: 4px 0 4px 14px; }
.debrief h3 { font-size: 1.05rem; }
.debrief p:last-child { margin-bottom: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }

/* ============================================================
   HUB
   ============================================================ */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.topbar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-top: 10px; padding-bottom: 10px; }
.brand { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); font-family: var(--ui); font-weight: 800; letter-spacing: -.01em; font-size: 1.15rem; display: flex; align-items: baseline; gap: 10px; }
.brand .mono { font-size: .75rem; color: var(--red); font-weight: 600; letter-spacing: .08em; }
.topbar .spacer { flex: 1; }
.budget { font-family: var(--mono); font-size: .8rem; display: flex; align-items: center; gap: 6px; }
.budget .pip { width: 10px; height: 10px; border-radius: 2px; background: var(--teal); }
.budget .pip.used { background: var(--line); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: transparent; padding: 12px 14px; font-weight: 600; color: var(--muted); cursor: pointer;
  border-bottom: 3px solid transparent; white-space: nowrap; border-radius: 0;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--teal); }
.tab .count { font-family: var(--mono); font-size: .75rem; background: var(--surface-2); padding: 1px 6px; border-radius: 999px; margin-left: 4px; }
main { padding: 20px 0 48px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; margin-bottom: 14px; }
.panel-head h2 { font-size: 1.5rem; margin: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

/* Pedigree */
.tree-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; }
.tree-scroll svg { display: block; width: 100%; min-width: 900px; height: auto; }
.ped-line { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.ped-gen { font-family: var(--mono); font-size: 13px; fill: var(--muted); font-weight: 600; }
.ped-name { font-family: var(--ui); font-size: 12.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.ped-sub { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
.ped-node { cursor: pointer; outline: none; }
.ped-node .shape { fill: var(--surface); stroke: var(--ink); stroke-width: 1.8; transition: fill .3s ease; }
.ped-node .ring { fill: none; stroke: transparent; stroke-width: 3; }
.ped-node:hover .ring, .ped-node:focus-visible .ring { stroke: var(--teal); }
.ped-node.affected .shape { fill: var(--red); stroke: var(--red); }
.ped-node.carrier .half { fill: var(--amber); }
.ped-node.carrier .shape { stroke: var(--amber); }
.ped-node.clear .shape { stroke: var(--green); stroke-width: 3; fill: var(--green-soft); }
.ped-node .slash { stroke: var(--ink); stroke-width: 1.8; }
.ped-node .idot { fill: var(--teal); stroke: var(--surface); stroke-width: 1.5; }
.ped-arrow { stroke: var(--ink); stroke-width: 1.6; fill: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 12px 2px 0; font-size: .85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 18px; height: 18px; overflow: visible; }
.tree-hint { margin: 12px 2px 0; font-size: .9rem; color: var(--muted); }

/* Lab */
.punnett { display: grid; grid-template-columns: 64px repeat(2, minmax(64px, 96px)); gap: 6px; margin: 14px 0; }
.punnett .hdr { display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 1.1rem; color: var(--muted); }
.punnett .hdr small { font-family: var(--ui); font-size: .65rem; font-weight: 500; display: block; text-align: center; }
.pcell {
  aspect-ratio: 1; border: 2px dashed var(--line); border-radius: 10px; background: var(--surface-2); cursor: pointer;
  font-family: var(--mono); font-size: 1.4rem; font-weight: 600; display: grid; place-items: center;
}
.pcell.filled { border-style: solid; border-color: var(--teal); background: var(--teal-soft); }
.pcell.wrong { border-color: var(--red); background: var(--red-soft); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
.choice {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: .5em .9em; cursor: pointer; font-weight: 600;
}
.choice[aria-pressed="true"], .choice[aria-checked="true"] { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }
.feedback { border-radius: 8px; padding: 12px 14px; margin-top: 12px; font-size: .95rem; }
.feedback.bad { background: var(--red-soft); color: var(--ink); border-left: 4px solid var(--red); }
.feedback.good { background: var(--green-soft); color: var(--ink); border-left: 4px solid var(--green); }
.feedback.info { background: var(--amber-soft); color: var(--ink); border-left: 4px solid var(--amber); }
.feedback ul { margin: .4em 0 0; padding-left: 1.2em; }

.test-list { display: grid; gap: 8px; }
.test-gen { font-family: var(--mono); font-size: .75rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 10px 0 2px; }
.test-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.test-row .who { flex: 1; min-width: 140px; }
.test-row .who b { display: block; font-size: .95rem; }
.test-row .who small { color: var(--muted); font-size: .78rem; }
.result { font-family: var(--mono); font-weight: 600; font-size: .85rem; padding: .25em .6em; border-radius: 6px; }
.result.affected { background: var(--red-soft); color: var(--red); }
.result.carrier { background: var(--amber-soft); color: var(--amber); }
.result.clear { background: var(--green-soft); color: var(--green); }
.result.na { background: var(--surface-2); color: var(--muted); }
.lock { display: flex; gap: 12px; align-items: flex-start; }
.lock .ico { font-size: 1.6rem; line-height: 1; }

.printout { font-family: var(--mono); font-size: .85rem; background: var(--surface-2); border-radius: 8px; padding: 14px; white-space: pre-wrap; border: 1px solid var(--line); }

/* Case board */
.objectives { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.objectives li { display: flex; gap: 10px; align-items: flex-start; }
.check { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 800; margin-top: 1px; }
.done .check { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
.done .obj-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.evidence-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.evidence-list li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.evidence-list b { display: block; }
.evidence-list small { font-family: var(--mono); color: var(--muted); font-size: .75rem; }
.hint-box { border: 1px dashed var(--teal); border-radius: 10px; padding: 12px 14px; background: var(--teal-soft); margin-bottom: 16px; }

/* Field notes */
.glossary { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.glossary dt { font-weight: 700; font-size: 1.05rem; }
.glossary dd { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.glossary .term { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }

/* ============================================================
   MODALS
   ============================================================ */
.backdrop {
  position: fixed; inset: 0; background: rgba(8,18,17,.55); z-index: 50; display: grid; place-items: center; padding: 16px;
  animation: fade .18s ease both;
}
.modal {
  background: var(--surface); color: var(--ink); width: 100%; max-width: 620px; max-height: calc(100vh - 32px); overflow-y: auto;
  border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); border: 1px solid var(--line);
  animation: rise .22s cubic-bezier(.2,.9,.3,1) both;
}
.modal.wide { max-width: 820px; }
.modal-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-head h2 { font-size: 1.25rem; margin: 0; }
.modal-head .sub { font-size: .85rem; color: var(--muted); }
.modal-head .grow { flex: 1; min-width: 0; }
.modal-close { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; flex: none; }
.modal-body { padding: 16px 20px 20px; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; padding: 0 20px 20px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }

.portrait {
  flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: var(--teal-soft); color: var(--teal); font-weight: 800; font-size: 1.15rem; border: 2px solid var(--teal);
}
.portrait img { width: 100%; height: 100%; object-fit: cover; }
.audio-strip {
  display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px;
  padding: 8px 12px; font-size: .82rem; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap;
}
.audio-strip audio { width: 100%; }
.audio-strip code { font-family: var(--mono); font-size: .75rem; }
.dialogue p { font-size: 1rem; }
.dialogue .stage { font-style: italic; color: var(--muted); }
.clue {
  display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--teal); background: var(--teal-soft);
  border-radius: 10px; padding: 10px 12px; margin-top: 8px;
}
.clue .tag { font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); font-weight: 600; }

/* Letter */
.letter {
  background: var(--paper); color: var(--paper-ink); font-family: var(--mono); font-size: .9rem; line-height: 1.65;
  padding: 26px 24px; border-radius: 4px; border: 1px solid var(--paper-edge);
  box-shadow: inset 0 0 60px rgba(120,90,30,.25), 0 4px 14px rgba(0,0,0,.18);
  transform: rotate(-.6deg); position: relative;
  background-image:
    radial-gradient(ellipse at 15% 10%, rgba(140,100,40,.18), transparent 40%),
    radial-gradient(ellipse at 85% 90%, rgba(140,100,40,.22), transparent 45%);
}
.letter p { margin-bottom: 1em; }
.letter .date { text-align: right; }
.letter .sig { margin-top: 1.4em; }
.trunk-intro { font-style: italic; color: var(--muted); margin-bottom: 16px; }

/* Accusation */
.suspects { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 18px; }
.suspect { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.suspect b { display: block; }
.suspect small { color: var(--muted); }
.suspect[aria-checked="true"] { border-color: var(--teal); background: var(--teal-soft); }
.ev-pick { display: grid; gap: 6px; margin: 8px 0; }
.ev-opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.ev-opt[aria-checked="true"] { border-color: var(--teal); background: var(--teal-soft); }
.ev-opt .box { flex: none; width: 18px; height: 18px; border: 2px solid var(--line); border-radius: 4px; margin-top: 3px; display: grid; place-items: center; font-size: .7rem; font-weight: 800; }
.ev-opt[aria-checked="true"] .box { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }

/* Toast */
.toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: .9rem; box-shadow: var(--shadow); animation: rise .25s ease both; }
.toast b { color: var(--teal-soft); }

@media (max-width: 520px) {
  .title-card { padding: 36px 20px 28px; }
  .card { padding: 16px; }
  .modal-head { padding: 14px 16px 10px; }
  .modal-body { padding: 14px 16px 16px; }
  .modal-foot { padding: 0 16px 16px; }
  .brand { font-size: 1rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
/* =====================================================================
   EDITABLE CONTENT
   Each investigation is one CASES.push({...}) block below. Everything a
   teacher might want to change lives in those blocks: names, ages,
   dialogue, evidence, rebuttals, and paths to your own audio/portraits.
   - Add `audio`, `portrait` (and `audioDeep` for the gatekeeper's second
     interview) to an `interviews` entry to replace the placeholders,
     e.g. audio: "audio/okafor/sam.mp3", portrait: "img/okafor/sam.jpg".
   - Dialogue strings may contain simple HTML such as <em>…</em>.
   - `truth` is the hidden genotype and must stay consistent with the
     case's `pattern`: "ar" (AA/Aa/aa), "ad" (Dd/dd), or "xlr"
     (XAXA/XAXa/XaXa for women, XAY/XaY for men).
   - Pedigree rows sit at y = 70/200/340/470; each member sets its own x.
   ===================================================================== */

const GLOSSARY = [
  { term: "Allele", def: "One version of a gene. You inherit two alleles for each autosomal gene, one from each parent." },
  { term: "Genotype", def: "The alleles a person has (for example AA, Aa or aa). Genotypes are hidden; you learn them from a test or deduce them from relatives." },
  { term: "Phenotype", def: "The observable trait: affected or unaffected, and how the condition shows itself." },
  { term: "Carrier", def: "A person with one copy of a recessive allele. Carriers are usually healthy but can pass the allele on to their children." },

const GEN_Y = { 1: 70, 2: 200, 3: 340, 4: 470 };

const PATTERN_LABELS = { ar: "Autosomal recessive", ad: "Autosomal dominant", xlr: "X-linked recessive", mt: "Mitochondrial" };

function progressState() {
  return {
    tab: "tree", interviewed: {}, evidence: [],
    punnett: ["", "", "", ""], fraction: null, certFeedback: null, certified: false,
    tests: {}, testsUsed: 0, lastTest: null,
    pattern: false, patternPick: null, gateOpen: false, archive: false,
    accuse: { suspect: null, evidence: [], feedback: null }, attempts: 0, solved: false
  };
}
function defaultState() {
  return Object.assign({ screen: "title", theme: "auto", caseId: null, closed: [] }, progressState());
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = Object.assign(defaultState(), JSON.parse(raw), { screen: "title" });
      if (!CASES.some(c => c.id === s.caseId)) Object.assign(s, progressState(), { caseId: null });
      return s;
    }
  } catch (e) { /* storage unavailable */ }
  return defaultState();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

let state = load();
let modal = null; // { type, id, openerFid }

// Current case shortcuts
const C = () => CASES.find(c => c.id === state.caseId);
const M = () => C().members;

function setState(patch) {
  Object.assign(state, patch);
  save();
  render();
  if (modal) renderModal(false);
}

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = name => name.split(/\s+/).filter(w => /[A-Za-z]/.test(w[0])).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const interviewCount = () => Object.keys(state.interviewed).length;
const has = ev => state.evidence.includes(ev);
const gatekeeper = () => Object.keys(C().interviews).find(id => C().interviews[id].gate);
const listNames = ids => ids.map(id => M()[id].short).join(" or ");
// XLR genotypes are stored as "XAXa"/"XaY" and displayed with superscript alleles
const fmtGeno = g => g ? g.replace(/X([Aa])/g, (_, a) => "X" + (a === "A" ? "ᴬ" : "ᵃ")) : "";

function genoStatus(id, g) {
  const p = C().pattern, m = M()[id];
  if (p === "ar") return g === "aa" ? "affected" : g === "Aa" ? "carrier" : "clear";
  if (p === "xlr") return (g === "XaY" || g === "XaXa") ? "affected" : g === "XAXa" ? "carrier" : "clear";
  return g.includes("D") ? (m.knownAffected ? "affected" : "carrier") : "clear";
}
function statusOf(id) {
  const m = M()[id], rev = C().archive.reveal || {};
  if (m.knownAffected) return "affected";
  if (state.archive && rev[id]) return rev[id];
  const t = state.tests[id];
  return t ? genoStatus(id, t) : "unknown";
}
function statusLabel(st) {
  const carrier = C().pattern === "ad" ? "variant-positive, no symptoms yet" : "confirmed carrier";
  return { affected: "affected", carrier, clear: "tested clear", unknown: "status unknown" }[st];
}
function shownGeno(id) {
  const m = M()[id];
  if (state.tests[id]) return state.tests[id];
  if (m.knownAffected) return m.truth;
  return "";
}

function addEvidence(id) {
  if (!id || has(id)) return false;
  state.evidence.push(id);
  toast(`New evidence: <b>${esc(C().evidence[id].title)}</b>`);
  return true;
}

function toast(html) {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = html;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 3800);
}

function applyTheme() {
  const r = document.documentElement;
  if (state.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", state.theme);
}

function caseReady() { return state.pattern && state.archive && state.testsUsed >= C().testsRequired; }

function startRandomCase() {
  const open = CASES.filter(c => !state.closed.includes(c.id) && c.id !== state.caseId);
  const pool = open.length ? open : CASES.filter(c => c.id !== state.caseId);
  const pick = (pool.length ? pool : CASES)[Math.floor(Math.random() * (pool.length || CASES.length))];
  modal = null;
  $("#modal-root").innerHTML = "";
  Object.assign(state, progressState(), { caseId: pick.id });
  setState({ screen: "brief" });
  window.scrollTo(0, 0);
}

/* ---------- FAMILY TREE ---------- */
const R = 18;
function shapeSvg(m, cls, extra = "") {
  const { x } = m, y = GEN_Y[m.gen];
  if (m.sex === "M") return `<rect class="${cls}" x="${x - R}" y="${y - R}" width="${R * 2}" height="${R * 2}" rx="2"${extra}/>`;
  return `<circle class="${cls}" cx="${x}" cy="${y}" r="${R}"${extra}/>`;
}
function halfSvg(m) {
  const { x } = m, y = GEN_Y[m.gen];
  if (m.sex === "M") return `<rect class="half" x="${x - R}" y="${y - R}" width="${R}" height="${R * 2}" rx="2"/>`;
  return `<path class="half" d="M ${x} ${y - R} A ${R} ${R} 0 0 0 ${x} ${y + R} Z"/>`;
}

function nodeSvg(id) {
  const m = M()[id], y = GEN_Y[m.gen], st = statusOf(id);
  const sub = m.deceased ? `d. ${m.years.split(/[–-]/)[1]}` : `${m.age}`;
  const geno = fmtGeno(shownGeno(id));
  const label = `${m.name}, ${m.deceased ? "deceased" : m.age}, ${m.role}. ${statusLabel(st)}${geno ? ", genotype " + geno : ""}${state.interviewed[id] ? ", interviewed" : ""}.`;
  let parts = shapeSvg(m, "shape");
  if (st === "carrier") parts += halfSvg(m) + shapeSvg(m, "shape", ' style="fill:none"');
  if (m.deceased) parts += `<line class="slash" x1="${m.x - R - 7}" y1="${y + R + 7}" x2="${m.x + R + 7}" y2="${y - R - 7}"/>`;
  if (state.interviewed[id]) parts += `<circle class="idot" cx="${m.x + R + 5}" cy="${y - R + 2}" r="5"/>`;
  const ring = m.sex === "M"
    ? `<rect class="ring" x="${m.x - R - 5}" y="${y - R - 5}" width="${R * 2 + 10}" height="${R * 2 + 10}" rx="6"/>`
    : `<circle class="ring" cx="${m.x}" cy="${y}" r="${R + 5}"/>`;
  return `<g class="ped-node ${st}" role="button" tabindex="0" aria-label="${esc(label)}" data-action="node" data-id="${id}" data-fid="node-${id}">
    <title>${esc(m.name)}</title>
    ${ring}${parts}
    <text class="ped-name" x="${m.x}" y="${y + R + 16}">${esc(m.short)}</text>
    <text class="ped-sub" x="${m.x}" y="${y + R + 30}">${esc(sub)}${geno ? " · " + geno : ""}</text>
  </g>`;
}

function connectorsSvg() {
  let out = "";
  for (const c of C().couples) {
    const [a, b] = c.partners.map(id => M()[id]).sort((p, q) => p.x - q.x);
    const y = GEN_Y[a.gen];
    out += `<line class="ped-line" x1="${a.x + R}" y1="${y}" x2="${b.x - R}" y2="${y}"/>`;
    if (!c.children || !c.children.length) continue;
    const mid = (a.x + b.x) / 2;
    const kids = c.children.map(id => M()[id]);
    const childY = GEN_Y[kids[0].gen];
    const railY = childY - R - 26;
    out += `<line class="ped-line" x1="${mid}" y1="${y}" x2="${mid}" y2="${railY}"/>`;
    const xs = kids.map(k => k.x).concat(mid);
    const lo = Math.min(...xs), hi = Math.max(...xs);
    if (hi > lo) out += `<line class="ped-line" x1="${lo}" y1="${railY}" x2="${hi}" y2="${railY}"/>`;
    for (const k of kids) out += `<line class="ped-line" x1="${k.x}" y1="${railY}" x2="${k.x}" y2="${childY - R}"/>`;
  }
  return out;
}

function probandArrow() {
  const p = Object.values(M()).find(m => m.proband);
  if (!p) return "";
  const y = GEN_Y[p.gen];
  const tipX = p.x - R - 3, tipY = y + R + 3;
  return `<g aria-hidden="true">
    <line class="ped-arrow" x1="${tipX - 22}" y1="${tipY + 18}" x2="${tipX - 4}" y2="${tipY + 3}"/>
    <path class="ped-arrow" d="M ${tipX} ${tipY} l -10 2 l 6 6 z"/>
  </g>`;
}

function renderTree() {
  const c = C();
  const gens = Object.entries(GEN_Y).map(([g, y]) => `<text class="ped-gen" x="12" y="${y + 5}">${ROMAN[g]}</text>`).join("");

  const ink = "var(--ink)";
  const carrierLabel = c.pattern === "ad" ? "Variant, no symptoms yet" : "Confirmed carrier";
  return `
  <div class="panel-head">
    <div><div class="eyebrow">Pedigree · ${esc(c.disorder)}</div><h2>${esc(c.family)} family tree</h2></div>
    <div class="muted" style="font-size:.9rem">${interviewCount()} interviewed · ${Object.keys(state.tests).length} tested</div>

  <div class="tree-scroll" tabindex="-1">
    <svg viewBox="0 0 1020 540" role="group" aria-label="${esc(c.family)} family pedigree. Use Tab to move between family members and Enter to open.">
      ${gens}${connectorsSvg()}${probandArrow()}${nodes}
    </svg>
  </div>
  <div class="legend" aria-label="Legend">
    <span>${mini(`<rect x="-8" y="-8" width="16" height="16" fill="none" stroke="${ink}" stroke-width="1.6"/>`)} Male</span>
    <span>${mini(`<circle r="8" fill="none" stroke="${ink}" stroke-width="1.6"/>`)} Female</span>
    <span>${mini(`<circle r="8" fill="var(--red)"/>`)} Affected</span>
    <span>${mini(`<circle r="8" fill="none" stroke="var(--amber)" stroke-width="1.6"/><path d="M0 -8 A8 8 0 0 0 0 8Z" fill="var(--amber)"/>`)} ${carrierLabel}</span>
    <span>${mini(`<circle r="8" fill="var(--green-soft)" stroke="var(--green)" stroke-width="2.4"/>`)} Tested clear</span>
    <span>${mini(`<circle r="7" fill="none" stroke="${ink}" stroke-width="1.6"/><line x1="-10" y1="10" x2="10" y2="-10" stroke="${ink}" stroke-width="1.6"/>`)} Deceased</span>
    <span>${mini(`<circle r="4" fill="var(--teal)"/>`)} Interviewed</span>
    <span>${mini(`<line x1="-9" y1="9" x2="2" y2="-2" stroke="${ink}" stroke-width="1.6"/><path d="M5 -5 l-7 1 l 5 5z" fill="${ink}"/>`)} Proband</span>
  </div>
  <p class="tree-hint">Select anyone on the tree to interview them. Scroll sideways on small screens.</p>`;
}

/* ---------- LAB ---------- */
function renderLab() {
  return `
  <div class="panel-head">
    <div><div class="eyebrow">${esc(C().gene)} genotyping</div><h2>Lab</h2></div>
  </div>
  ${state.certified ? renderTests() : renderCert()}`;
}

function renderCert() {
  const P = C().punnett;
  const fb = state.certFeedback;
  const wrong = fb && fb.wrongCells ? fb.wrongCells : [];
  const cells = state.punnett.map((v, i) => {
    const r = P.side.alleles[Math.floor(i / 2)], col = P.top.alleles[i % 2];
    return `<button class="pcell ${v ? "filled" : ""} ${wrong.includes(i) ? "wrong" : ""}" data-action="cell" data-i="${i}" data-fid="cell-${i}" aria-label="${esc(P.side.name)} ${fmtGeno(r)}, ${esc(P.top.name)} ${fmtGeno(col)}: ${v ? fmtGeno(v) : "empty"}. Activate to cycle.">${v ? fmtGeno(v) : "?"}</button>`;
  });
  const hdr = (a, who) => `<div class="hdr">${fmtGeno(a)}<small>${esc(who)}</small></div>`;
  return `
  <div class="grid-2">
    <section class="card">
      <div class="eyebrow">Step 1 · Lab certification</div>
      <h3>Before you touch a sample</h3>
      <p>The lab won't run tests for you until you show you can predict offspring. ${P.intro} Tap a cell to cycle through genotypes.</p>
      <div class="punnett" role="group" aria-label="Punnett square, ${esc(P.top.name)} across the top, ${esc(P.side.name)} down the side">
        <div></div>
        ${hdr(P.top.alleles[0], P.top.name)}${hdr(P.top.alleles[1], P.top.name)}
        ${hdr(P.side.alleles[0], P.side.name)}${cells[0]}${cells[1]}
        ${hdr(P.side.alleles[1], P.side.name)}${cells[2]}${cells[3]}
      </div>
      <p style="margin-bottom:4px"><b>${esc(P.question)}</b></p>
      <div class="choices" role="radiogroup" aria-label="Fraction">
        ${P.fractions.map(f => `<button class="choice" role="radio" aria-checked="${state.fraction === f}" data-action="frac" data-v="${f}" data-fid="frac-${f}">${f}</button>`).join("")}
      </div>
      <button class="btn" data-action="certify" data-fid="certify">Submit for certification</button>
      ${fb ? `<div class="feedback bad" role="alert">${fb.html}</div>` : ""}
    </section>
    <section class="card">
      <div class="eyebrow">Locked</div>
      <div class="lock"><div class="ico" aria-hidden="true">🔒</div><div>
        <h3>Genetic testing</h3>
        <p class="muted">${C().testBudget} tests available after certification. Each reveals a living family member's genotype at ${esc(C().gene)}.</p>
      </div></div>
    </section>
  </div>`;
}

function resultWord(id, t) {
  const st = genoStatus(id, t);
  return st === "carrier" ? (C().pattern === "ad" ? "variant · presymptomatic" : "carrier") : st;
}

function renderTests() {
  const c = C();
  const left = c.testBudget - state.testsUsed;
  const byGen = [1, 2, 3, 4].map(g => {
    const rows = Object.entries(M()).filter(([, m]) => m.gen === g).map(([id, m]) => {
      const t = state.tests[id];
      let right;
      if (m.deceased) right = `<span class="result na">No sample · deceased</span>`;
      else if (m.knownAffected) right = `<span class="result affected">${fmtGeno(m.truth)} · diagnosed</span>`;
      else if (m.minor && !c.testMinors) right = `<span class="result na">Deferred · minor</span>`;
      else if (t) right = `<span class="result ${genoStatus(id, t)}">${fmtGeno(t)} · ${resultWord(id, t)}</span>`;
      else right = `<button class="btn small" data-action="test" data-id="${id}" data-fid="test-${id}" ${left <= 0 ? "disabled" : ""}>Run test</button>`;
      return `<div class="test-row"><div class="who"><b>${esc(m.name)}</b><small>${esc(m.role)}</small></div>${right}</div>`;
    }).join("");
    return rows ? `<div class="test-gen">Generation ${ROMAN[g]}</div>${rows}` : "";
  }).join("");

  let last = "";
  if (state.lastTest) {
    const id = state.lastTest, t = state.tests[id];
    last = `<div class="printout" aria-live="polite">${resultPrintout(id, t)}</div>${testNote(id) ? `<div class="feedback info">${testNote(id)}</div>` : ""}`;
  }

  const canPattern = interviewCount() >= c.interviewsForPattern;
  const gk = M()[gatekeeper()];
  const patternCard = state.pattern
    ? `<div class="chip green">✓ Solved · ${PATTERN_LABELS[c.pattern].toLowerCase()}</div><p style="margin-top:10px" class="muted">The Gen-I archive is unsealed. ${esc(gk.short)} may be ready to talk.</p>`
    : canPattern
      ? `<p>You've heard enough of the family's story to classify the inheritance pattern.</p><button class="btn" data-action="pattern" data-fid="pattern">Run pattern analysis</button>`
      : `<div class="lock"><div class="ico" aria-hidden="true">🔒</div><p class="muted">Unlocks after ${c.interviewsForPattern} interviews (${interviewCount()}/${c.interviewsForPattern}). You need the family's history before you can read the pattern.</p></div>`;

  const minorNote = !c.testMinors
    ? `<p class="muted" style="font-size:.85rem">Children aren't offered predictive testing for an adult-onset condition. That choice is theirs to make when they're grown.</p>` : "";

  return `
  <div class="grid-2">
    <section class="card">
      <div class="eyebrow">Step 2 · Genetic testing</div>
      <h3>${left} of ${c.testBudget} tests remaining</h3>
      <p class="muted" style="font-size:.9rem">Results update the pedigree. Think before you spend: some genotypes can be deduced for free.</p>
      ${minorNote}
      ${last}
      <div class="test-list">${byGen}</div>
    </section>
    <div style="display:grid;gap:16px;align-content:start">
      <section class="card">
        <div class="eyebrow">Pattern analysis</div>
        <h3>How is it inherited?</h3>
        ${patternCard}
      </section>
      <section class="card">
        <div class="eyebrow">Certification</div>
        <div class="chip green">✓ Certified</div>
        <p class="muted" style="margin-top:10px;font-size:.9rem">${fmtGeno(c.punnett.summary)}</p>
      </section>
    </div>
  </div>`;
}

function resultPrintout(id, t) {
  const m = M()[id], st = genoStatus(id, t);
  const interp = {
    affected: "VARIANT — AFFECTED",
    carrier: C().pattern === "ad" ? "VARIANT DETECTED — PRESYMPTOMATIC" : C().pattern === "xlr" ? "ONE VARIANT X — CARRIER" : "HETEROZYGOUS — CARRIER",
    clear: "NO VARIANT DETECTED — CLEAR"
  }[st];
  return `${esc(C().gene)} PANEL · CASE ${esc(C().number)}
SUBJECT   ${esc(m.name.toUpperCase())}
GENOTYPE  ${fmtGeno(t)}
RESULT    ${interp}`;
}

function testNote(id) {
  const t = state.tests[id], m = M()[id];
  if (C().testNotes[id]) return C().testNotes[id];
  const st = genoStatus(id, t);
  if (st === "clear") return `${esc(m.short)} is clear: no copy of the variant.`;
  if (st === "carrier") return C().pattern === "ad"
    ? `${esc(m.short)} carries the variant but has no symptoms yet. For a late-onset dominant condition, that's a heavy thing to learn, which is why testing is always voluntary.`
    : `${esc(m.short)} is a healthy carrier.`;
  return "";
}

/* ---------- CASE BOARD ---------- */
function nextLead() {
  const c = C(), gk = M()[gatekeeper()], prob = Object.values(M()).find(m => m.proband);
  if (interviewCount() < 2) return `Start on the Family Tree: talk to ${prob.short}, the proband, and to the relatives closest to them.`;
  if (!state.certified) return "Head to the Lab and earn your certification so you can run tests.";
  if (interviewCount() < c.interviewsForPattern) return `Keep interviewing — pattern analysis needs ${c.interviewsForPattern} conversations.`;
  if (!state.pattern) return "Run Pattern Analysis in the Lab.";
  if (!state.gateOpen) return `Now that you know the pattern, ${gk.short} may agree to talk.`;
  if (!state.archive) return `The Gen-I records are unsealed — select ${listNames(c.archive.holders)} on the tree to open the archive.`;
  if (state.testsUsed < c.testsRequired) return `Run at least ${c.testsRequired} genetic tests to confirm the picture.`;
  return "You have what you need. Make your case.";
}

function renderBoard() {
  const c = C();
  const objs = [
    [interviewCount() >= c.interviewsObjective, `Interview at least ${c.interviewsObjective} family members (${Math.min(interviewCount(), c.interviewsObjective)}/${c.interviewsObjective})`],
    [state.certified, "Earn lab certification (Punnett square)"],
    [state.pattern, "Identify the inheritance pattern"],
    [state.archive, "Open the Gen-I archive"],
    [state.testsUsed >= c.testsRequired, `Run ${c.testsRequired}+ genetic tests (${Math.min(state.testsUsed, c.testsRequired)}/${c.testsRequired})`],
    [state.solved, "Name patient zero"]
  ];
  const ev = state.evidence.length
    ? `<ul class="evidence-list">${state.evidence.map(id => `<li><b>${esc(c.evidence[id].title)}</b>${esc(c.evidence[id].detail)}<br><small>${esc(c.evidence[id].source)}</small></li>`).join("")}</ul>`
    : `<p class="muted">No evidence yet. Interviews, lab results and archives all produce evidence.</p>`;
  const ready = caseReady();
  return `
  <div class="panel-head">
    <div><div class="eyebrow">Case ${esc(c.number)}</div><h2>Case board</h2></div>
  </div>
  <div class="hint-box"><b>Next lead:</b> ${esc(nextLead())}</div>
  <div class="grid-2">
    <section class="card">
      <h3>Objectives</h3>
      <ul class="objectives">${objs.map(([d, t]) => `<li class="${d ? "done" : ""}"><span class="check" aria-hidden="true">${d ? "✓" : ""}</span><span class="obj-text">${esc(t)}<span class="sr-only">${d ? " — complete" : " — incomplete"}</span></span></li>`).join("")}</ul>
      <hr style="border:0;border-top:1px dashed var(--line);margin:18px 0">
      <h3>Make your case</h3>
      <p class="muted" style="font-size:.9rem">${ready ? "Name one suspect and support it with exactly three pieces of evidence." : `Unlocks once you've identified the pattern, opened the archive, and run ${c.testsRequired} tests.`}</p>
      <button class="btn" data-action="accuse" data-fid="accuse" ${ready ? "" : "disabled"}>${ready ? "Name patient zero" : "🔒 Locked"}</button>
      ${state.solved ? `<button class="btn ghost" data-action="toWin" data-fid="toWin" style="margin-left:8px">View debrief</button>` : ""}
    </section>
    <section class="card">
      <h3>Evidence <span class="chip">${state.evidence.length}</span></h3>
      ${ev}
    </section>
  </div>`;
}

/* ---------- FIELD NOTES ---------- */
function renderNotes() {
  return `
  <div class="panel-head">
    <div><div class="eyebrow">Reference</div><h2>Field notes</h2></div>
  </div>
  <dl class="glossary">${GLOSSARY.map(g => `<div class="term"><dt>${esc(g.term)}</dt><dd>${esc(g.def)}</dd></div>`).join("")}</dl>`;
}

/* ---------- WIN ---------- */
function renderWin() {
  const c = C(), d = c.debrief;
  const more = CASES.length - state.closed.length;
  return `
  <div class="screen-center">
    <article class="card win-card">
      <span class="stamp" style="color:var(--green);border-color:var(--green)">Case closed · ${esc(c.number)}</span>
      <h1 style="margin-top:.5em">${esc(d.headline)}</h1>
      <p class="muted">${d.lede}</p>
      <div class="stats">
        <span class="chip">${state.testsUsed}/${c.testBudget} tests used</span>
        <span class="chip">${interviewCount()} interviews</span>
        <span class="chip">${state.evidence.length} evidence items</span>
        <span class="chip ${state.attempts > 1 ? "amber" : "green"}">${state.attempts} accusation${state.attempts === 1 ? "" : "s"}</span>
        <span class="chip">${state.closed.length}/${CASES.length} cases closed</span>
      </div>
      <div class="debrief">
        ${d.sections.map(s => `<section><h3>${esc(s.title)}</h3><p>${s.html}</p></section>`).join("")}
      </div>
      <div class="title-actions">
        <button class="btn" data-action="random" data-fid="randomWin">${more ? "Start another investigation" : "Replay a random case"}</button>

      </div>

/* =====================================================================
   MODALS
   ===================================================================== */
function openModal(type, id) {
  const ae = document.activeElement;
  modal = { type, id, openerFid: ae && ae.dataset ? ae.dataset.fid : null };
  renderModal(true);
}
function closeModal() {
  if (!modal) return;
  const fid = modal.openerFid;
  modal = null;
  $("#modal-root").innerHTML = "";
  render();
  if (fid) { const el = document.querySelector(`[data-fid="${fid}"]`); if (el) el.focus(); }
}

function renderModal(initial) {
  const fid = !initial && document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  const spec = MODALS[modal.type](modal.id);
  $("#modal-root").innerHTML = `
  <div class="backdrop" data-action="backdrop">
    <div class="modal ${spec.wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-head">
        ${spec.portrait || ""}
        <div class="grow"><h2 id="modal-title">${spec.title}</h2>${spec.sub ? `<div class="sub">${spec.sub}</div>` : ""}</div>
        <button class="modal-close" data-action="close" data-fid="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">${spec.body}</div>
      ${spec.foot ? `<div class="modal-foot">${spec.foot}</div>` : ""}
    </div>
  </div>`;
  const dlg = $("#modal-root .modal");
  if (fid) { const el = dlg.querySelector(`[data-fid="${fid}"]`); if (el) { el.focus(); return; } }
  if (initial) dlg.focus();
}

function portraitHtml(id) {
  const iv = C().interviews[id], m = M()[id];
  const inner = iv && iv.portrait ? `<img src="${esc(iv.portrait)}" alt="">` : esc(initials(m.name));
  return `<div class="portrait" aria-hidden="true">${inner}</div>`;
}
function audioHtml(id) {
  const iv = C().interviews[id];
  const deep = iv.gate && state.pattern;
  const src = deep ? iv.audioDeep : iv.audio;
  if (src) return `<div class="audio-strip"><audio controls preload="none" src="${esc(src)}"></audio></div>`;
  return `<div class="audio-strip"><span aria-hidden="true">🎙</span> placeholder — replace with your own recording <code>audio/${C().id}/${id}${deep ? "_deep" : ""}.mp3</code></div>`;
}
function clueHtml(evId) {
  if (!evId) return "";
  const e = C().evidence[evId];
  return `<div class="clue"><span aria-hidden="true">📎</span><div><div class="tag">Evidence logged</div><b>${esc(e.title)}</b><div style="font-size:.9rem">${esc(e.detail)}</div></div></div>`;
}

const MODALS = {
  interview(id) {
    const m = M()[id], iv = C().interviews[id];
    const gated = iv.gate && !state.pattern;
    const lines = gated ? iv.refusal : iv.lines;
    return {
      title: esc(m.name), sub: `${m.age} · ${esc(m.role)}`, portrait: portraitHtml(id),
      body: `${audioHtml(id)}<div class="dialogue">${lines.map(l => `<p>${l}</p>`).join("")}</div>
        ${gated ? `<div class="feedback info">${esc(m.short)} won't talk until you've established the inheritance pattern (Lab → Pattern analysis).</div>` : clueHtml(iv.clue)}`,
      foot: `<button class="btn" data-action="close" data-fid="modal-done">Done</button>`
    };
  },
  info(id) {
    const m = M()[id], c = C();
    let body;
    if (m.minor) body = `<p>${esc(m.short)} is ${m.age}. Counselors don't interview young children about family medical history — talk to the parents instead.</p>` +
      (c.testMinors ? `<p>${esc(m.short)} can still be tested in the Lab with parental consent.</p>`
        : `<div class="feedback info">For an adult-onset condition, predictive testing of children is deferred: ${esc(m.short)} gets to decide whether to know, as an adult.</div>`);
    else body = `<p>${esc(m.name)} (${esc(m.years)}) is deceased. There's no one to interview and no sample to test.</p>
      ${c.archive.holders.includes(id) && !state.pattern ? `<div class="feedback info">${esc(c.sealedNote)}</div>` : ""}`;
    return { title: esc(m.name), sub: esc(m.role), portrait: `<div class="portrait" aria-hidden="true">${esc(initials(m.name))}</div>`, body,
      foot: `<button class="btn" data-action="close" data-fid="modal-done">Close</button>` };
  },
  archive() {
    const A = C().archive;
    return {
      title: esc(A.title), sub: esc(A.sub), wide: true,
      body: `<p class="trunk-intro">${esc(A.intro)}</p>
        <div class="letter">
          <p class="date">${esc(A.date)}</p>
          ${A.paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}
          <p class="sig">${esc(A.signoff).replace(/\n/g, "<br>")}</p>
        </div>
        ${clueHtml(A.clue)}`,
      foot: `<button class="btn" data-action="close" data-fid="modal-done">Close the archive</button>`
    };
  },
  pattern() {
    const c = C();
    const fb = state.patternPick ? c.patternFeedback[state.patternPick] : null;
    const correct = state.patternPick === c.pattern;
    return {
      title: "Pattern analysis", sub: `Which inheritance pattern fits the ${esc(c.family)} pedigree?`,
      body: `<p>Consider what you've learned: who is affected, who their parents are, which sexes are affected, and how the affected relatives connect.</p>
        <div class="choices" role="radiogroup" aria-label="Inheritance pattern" style="display:grid">
          ${Object.entries(PATTERN_LABELS).map(([id, label]) => `<button class="choice" role="radio" aria-checked="${state.patternPick === id}" data-action="patternPick" data-v="${id}" data-fid="pp-${id}" ${state.pattern ? "disabled" : ""}>${esc(label)}</button>`).join("")}
        </div>
        ${fb ? `<div class="feedback ${correct ? "good" : "bad"}" role="alert">${esc(fb)}${correct ? `<br><br><b>Unlocked:</b> the Gen-I archive and ${esc(M()[gatekeeper()].short)}'s interview.` : ""}</div>` : ""}`,
      foot: `<button class="btn ${state.pattern ? "" : "ghost"}" data-action="close" data-fid="modal-done">${state.pattern ? "Continue" : "Close"}</button>`
    };
  },
  accuse() {
    const c = C(), a = state.accuse;
    const suspects = c.suspects.map(s => {
      const m = M()[s.id];
      return `<button class="suspect" role="radio" aria-checked="${a.suspect === s.id}" data-action="suspect" data-v="${s.id}" data-fid="sus-${s.id}"><b>${esc(m.name)}</b><small>Gen ${ROMAN[m.gen]} · ${esc(m.role.split(" · ")[0])}</small></button>`;
    }).join("");
    const evs = state.evidence.map(id => {
      const on = a.evidence.includes(id);
      return `<button class="ev-opt" role="checkbox" aria-checked="${on}" data-action="evPick" data-v="${id}" data-fid="ev-${id}"><span class="box" aria-hidden="true">${on ? "✓" : ""}</span><span><b>${esc(c.evidence[id].title)}</b><br><small class="muted">${esc(c.evidence[id].source)}</small></span></button>`;
    }).join("");
    const ok = a.suspect && a.evidence.length === 3;
    return {
      title: "Name patient zero", sub: "One suspect. Exactly three pieces of evidence.", wide: true,
      body: `<h3 style="font-size:1rem">1 · Who brought the variant into this family?</h3>
        <div class="suspects" role="radiogroup" aria-label="Suspect">${suspects}</div>
        <h3 style="font-size:1rem">2 · Your evidence <span class="chip">${a.evidence.length}/3</span></h3>
        <div class="ev-pick" role="group" aria-label="Evidence, choose three">${evs}</div>
        ${a.feedback ? `<div class="feedback bad" role="alert">${a.feedback}</div>` : ""}`,
      foot: `<button class="btn ghost" data-action="close" data-fid="modal-cancel">Keep investigating</button>
             <button class="btn" data-action="submitCase" data-fid="submitCase" ${ok ? "" : "disabled"}>Submit case</button>`
    };
  },
  reset() {
    return {
      title: "Restart this case?", sub: `Case ${esc(C().number)} · ${esc(C().family)} family`,
      body: `<p>Interviews, test results, evidence and certification for this case will be erased. Cases you've already closed stay closed.</p>`,
      foot: `<button class="btn ghost" data-action="close" data-fid="modal-cancel">Cancel</button>
             <button class="btn danger" data-action="doReset" data-fid="doReset">Restart case</button>`
    };
  },
  wipe() {
    return {
      title: "Erase all progress?", sub: "This clears everything saved on this device.",
      body: `<p>Your current investigation and your record of closed cases will be erased.</p>`,
      foot: `<button class="btn ghost" data-action="close" data-fid="modal-cancel">Cancel</button>
             <button class="btn danger" data-action="doWipe" data-fid="doWipe">Erase everything</button>`
    };
  }
};

/* =====================================================================
   ACTIONS
   ===================================================================== */
function openNode(id) {
  const m = M()[id], c = C();
  if (m.deceased) {
    if (state.pattern && c.archive.holders.includes(id)) {
      state.archive = true;
      addEvidence(c.archive.clue);
      save(); render();
      openModal("archive");
    } else openModal("info", id);
    return;
  }
  const iv = c.interviews[id];
  if (m.minor || !iv) { openModal("info", id); return; }
  if (!(iv.gate && !state.pattern)) {
    state.interviewed[id] = true;
    if (iv.gate) state.gateOpen = true;
    addEvidence(iv.clue);
    save(); render();
  }
  openModal("interview", id);
}

function certify() {
  const P = C().punnett;
  const expected = P.cells;
  const wrongCells = state.punnett.map((v, i) => (v === expected[i] ? -1 : i)).filter(i => i >= 0);
  const msgs = [];
  if (state.punnett.some(v => !v)) msgs.push("Fill every cell first — each box is one possible child.");
  else wrongCells.forEach(i => {
    const r = P.side.alleles[Math.floor(i / 2)], col = P.top.alleles[i % 2];
    msgs.push(`${esc(P.side.name)}'s <b>${fmtGeno(r)}</b> + ${esc(P.top.name)}'s <b>${fmtGeno(col)}</b> should give <b>${fmtGeno(expected[i])}</b>, not ${fmtGeno(state.punnett[i])}. Each child gets one allele from the row parent and one from the column parent.`);
  });
  if (state.fraction !== P.correct) msgs.push(state.fraction ? P.fractionFeedback[state.fraction] : "Choose an answer to the fraction question.");
  if (msgs.length) {
    setState({ certFeedback: { wrongCells, html: `<b>Not certified yet.</b><ul>${msgs.map(m => `<li>${m}</li>`).join("")}</ul>` } });
    return;
  }
  toast("<b>Lab certified.</b> Genetic testing unlocked.");
  setState({ certified: true, certFeedback: null });
}

function runTest(id) {
  const m = M()[id], c = C();
  if (m.deceased || m.knownAffected || state.tests[id] || state.testsUsed >= c.testBudget) return;
  if (m.minor && !c.testMinors) return;
  state.tests[id] = m.truth;
  state.testsUsed += 1;
  state.lastTest = id;
  for (const le of c.labEvidence) {
    if (Object.entries(le.when).every(([k, g]) => state.tests[k] === g)) addEvidence(le.evidence);
  }
  setState({});
  const p = document.querySelector(".printout");
  if (p) p.scrollIntoView({ block: "nearest" });
}

function submitCase() {
  const c = C(), a = state.accuse;
  state.attempts += 1;
  const ev = a.evidence;
  if (a.suspect === c.answer) {
    const reqOk = c.win.required.every(e => ev.includes(e));
    const anyOk = !c.win.anyOf.length || c.win.anyOf.some(e => ev.includes(e));
    if (reqOk && anyOk) {
      state.solved = true;
      state.accuse.feedback = null;
      if (!state.closed.includes(c.id)) state.closed.push(c.id);
      modal = null;
      $("#modal-root").innerHTML = "";
      setState({ screen: "win" });
      window.scrollTo(0, 0);
      return;
    }
    let fb = "<b>Right suspect — but this case wouldn't hold up.</b> ";
    if (!reqOk) fb += c.win.missingRequired + " ";
    if (!anyOk) fb += c.win.missingAnyOf;
    setState({ accuse: Object.assign({}, a, { feedback: fb }) });
    return;
  }
  const s = c.suspects.find(x => x.id === a.suspect);
  setState({ accuse: Object.assign({}, a, { feedback: `<b>Not ${esc(M()[a.suspect].short)}.</b> ${esc(s.rebuttal)}` }) });
}

const ACTIONS = {
  random: () => startRandomCase(),
  resume: () => setState({ screen: "hub" }),
  begin: () => setState({ screen: "hub", tab: "tree" }),
  toTitle: () => setState({ screen: "title" }),
  tab: el => setState({ tab: el.dataset.tab }),
  theme: () => setState({ theme: { auto: "light", light: "dark", dark: "auto" }[state.theme] }),
  node: el => openNode(el.dataset.id),
  cell: el => {
    const i = +el.dataset.i, p = state.punnett.slice(), cycle = [""].concat(C().punnett.options);
    p[i] = cycle[(cycle.indexOf(p[i]) + 1) % cycle.length];
    setState({ punnett: p });
  },
  frac: el => setState({ fraction: el.dataset.v }),
  certify,
  test: el => runTest(el.dataset.id),
  pattern: () => openModal("pattern"),
  patternPick: el => {
    const id = el.dataset.v, correct = id === C().pattern;
    if (correct && !state.pattern) toast("<b>Pattern established.</b> Gen-I archive unsealed.");
    setState({ patternPick: id, pattern: state.pattern || correct });
  },
  accuse: () => openModal("accuse"),
  suspect: el => setState({ accuse: Object.assign({}, state.accuse, { suspect: el.dataset.v, feedback: null }) }),
  evPick: el => {
    const id = el.dataset.v, cur = state.accuse.evidence.slice();
    const i = cur.indexOf(id);
    if (i >= 0) cur.splice(i, 1);
    else if (cur.length < 3) cur.push(id);
    else { toast("Exactly three pieces of evidence — deselect one first."); return; }
    setState({ accuse: Object.assign({}, state.accuse, { evidence: cur, feedback: null }) });
  },
  submitCase,
  toWin: () => setState({ screen: "win" }),
  backToFile: () => setState({ screen: "hub", tab: "board" }),
  askReset: () => openModal("reset"),
  doReset: () => {
    modal = null;
    $("#modal-root").innerHTML = "";
    Object.assign(state, progressState());
    setState({ screen: "brief" });
  },
  askWipe: () => openModal("wipe"),
  doWipe: () => {
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
    const theme = state.theme;
    state = defaultState();
    state.theme = theme;
    modal = null;
    $("#modal-root").innerHTML = "";
    save(); render();
    const s = $('[data-fid="random"]'); if (s) s.focus();
  },
  close: () => closeModal(),
  backdrop: (el, e) => { if (e.target === el) closeModal(); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modal) { e.preventDefault(); closeModal(); return; }

  // Enter/Space on SVG pedigree nodes (they're <g role="button">, not native buttons)
  const node = e.target.closest && e.target.closest(".ped-node");
  if (node && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openNode(node.dataset.id); return; }

  // Arrow keys move between tabs
  if (e.target.getAttribute && e.target.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const ids = ["tree", "lab", "board", "notes"];
    const i = ids.indexOf(e.target.dataset.tab);
    const next = ids[(i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
    setState({ tab: next });
    const t = $(`#tab-${next}`); if (t) t.focus();
    e.preventDefault();
    return;
  }

  // Focus trap inside modal
  if (e.key === "Tab" && modal) {
    const dlg = $("#modal-root .modal");
    const f = [...dlg.querySelectorAll("button:not([disabled]), [href], audio, [tabindex]:not([tabindex='-1'])")];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === dlg)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

render();
</script>
</body>
</html>
